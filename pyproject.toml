[project]
name = "jyry-ai"
version = "0.1.0"
description = "JYRY AI — Telegram bot that automates Ausbildung job applications via Gmail."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "JYRRY" }]
keywords = ["telegram", "ausbildung", "gmail", "automation", "jobs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
]

dependencies = [
    "python-telegram-bot[ext]>=21.6,<22",
    "SQLAlchemy[asyncio]>=2.0.34,<3",
    "asyncpg>=0.29.0,<0.30",
    "alembic>=1.13.2,<2",
    "redis>=5.0.8,<6",
    "APScheduler>=3.10.4,<4",
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.30.6,<0.32",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.5.2,<3",
    "cryptography>=43.0.1,<44",
    "httpx>=0.27.2,<0.28",
    "aiosmtplib>=3.0.2,<4",
    "email-validator>=2.2.0,<3",
    "python-dotenv>=1.0.1,<2",
    "structlog>=24.4.0,<25",
    "tenacity>=9.0.0,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-mock>=3.14.0,<4",
    "pytest-cov>=5.0.0,<6",
    "respx>=0.21.1,<0.22",
    "aiosqlite>=0.20.0,<0.21",
    "ruff>=0.6.8,<0.7",
    "mypy>=1.11.2,<2",
    "types-redis>=4.6.0,<5",
]

[project.scripts]
jyry-bot = "jyry.bot.main:run"
jyry-webhook = "jyry.payments.webhook:run"

[project.urls]
Repository = "https://github.com/JYRRY/Ausbildung"
Issues = "https://github.com/JYRRY/Ausbildung/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jyry*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
