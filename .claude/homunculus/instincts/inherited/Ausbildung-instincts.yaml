# Ausbildung Workflow Database Migration Workflow

## Action

Follow the database-migration-workflow workflow:
1. Edit alembic/env.py to ensure new models are imported and registered
2. Create or update migration scripts in alembic/versions/
3. Update alembic.ini or alembic/script.py.mako if migration config or templates change
4. Document migration usage or changes in alembic/README.md

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: alembic/env.py, alembic/versions/*.py, alembic.ini

