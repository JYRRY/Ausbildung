# Ausbildung Workflow Add New Database Model

## Action

Follow the add-new-database-model workflow:
1. Edit or create model classes in jyry/db/models.py
2. Update or add enums in jyry/db/enums.py if needed
3. Add or update reference constants in jyry/constants.py if needed
4. Update jyry/db/base.py or mixins if new conventions or mixins are required
5. Update jyry/db/__init__.py to expose new models if necessary

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: jyry/db/models.py, jyry/db/enums.py, jyry/constants.py

