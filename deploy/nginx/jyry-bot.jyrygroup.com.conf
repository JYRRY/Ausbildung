# nginx config for bot.jyrygroup.com — hybrid static + dashboard + webhook
#
# Same hostname, three logical surfaces:
#   1. Static marketing site (/, /pricing, /terms, /privacy, /refund,
#      /imprint, /checkout). Files under /var/www/jyry.
#   2. /app/*   → Next.js dashboard (jyry-web.service, 127.0.0.1:3000)
#   3. /api/*   → FastAPI dashboard backend (jyry-api.service, 127.0.0.1:8001)
#   4. /webhook → FastAPI Paddle webhook (jyry-webhook.service, 127.0.0.1:8080)
#
# Install:
#   sudo cp jyry-bot.jyrygroup.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/jyry-bot.jyrygroup.com.conf /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/jyry-webhook.conf  # replaced by this file
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name bot.jyrygroup.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.jyrygroup.com;

    ssl_certificate     /etc/letsencrypt/live/bot.jyrygroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.jyrygroup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Sensible security headers for the whole virtual host.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 1) Static marketing site ----
    root /var/www/jyry;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ---- 2) Next.js dashboard at /app/* ----
    location /app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # ---- 3) Dashboard API at /api/* ----
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- 4) Paddle webhook (kept on its own port for isolation) ----
    location = /webhook/paddle {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Paddle-Signature  $http_paddle_signature;
        proxy_read_timeout 30s;
    }
}
