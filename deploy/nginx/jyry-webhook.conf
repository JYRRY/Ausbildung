# nginx reverse proxy for the JYRY AI Lemon Squeezy webhook.
# Drop into /etc/nginx/sites-available/ then:
#   ln -s /etc/nginx/sites-available/jyry-webhook.conf /etc/nginx/sites-enabled/
#   certbot --nginx -d webhook.jyry.example.com
# Replace webhook.jyry.example.com with your actual domain.

server {
    listen 80;
    listen [::]:80;
    server_name webhook.jyry.example.com;

    # ACME challenge passthrough — certbot will handle the rest.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name webhook.jyry.example.com;

    ssl_certificate     /etc/letsencrypt/live/webhook.jyry.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webhook.jyry.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Lemon Squeezy webhooks are small JSON bodies; cap aggressively.
    client_max_body_size 64k;

    # Only the webhook path is exposed.
    location = /webhook/lemonsqueezy {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Critical: forward the LS signature header verbatim.
        proxy_set_header X-Signature       $http_x_signature;
        proxy_read_timeout 30s;
    }

    # Anything else gets a flat 404 — no app discovery surface.
    location / {
        return 404;
    }
}
