# nginx config for bot.jyrygroup.com
#
# Serves two things on the same hostname:
#   1. The static marketing site (root pages) used for Paddle merchant
#      verification and public-facing product info. Files live under
#      /var/www/jyry.
#   2. The Lemon Squeezy webhook receiver at /webhook/lemonsqueezy,
#      proxied to the FastAPI app on 127.0.0.1:8080. Body capped at 64k
#      and the X-Signature header forwarded verbatim so HMAC verification
#      works.
#
# Install:
#   sudo cp jyry-webhook.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/jyry-webhook.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d bot.jyrygroup.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name bot.jyrygroup.com;

    # ACME challenge passthrough — certbot will handle the rest.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.jyrygroup.com;

    ssl_certificate     /etc/letsencrypt/live/bot.jyrygroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.jyrygroup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Static marketing site.
    root /var/www/jyry;
    index index.html;

    # Clean URLs: /pricing -> pricing.html, /terms -> terms.html, etc.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Webhook path — body capped aggressively, signature header forwarded.
    location = /webhook/lemonsqueezy {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Critical: forward the LS signature header verbatim.
        proxy_set_header X-Signature       $http_x_signature;
        proxy_read_timeout 30s;
    }
}
